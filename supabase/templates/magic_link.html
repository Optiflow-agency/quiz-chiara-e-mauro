<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Il tuo codice di verifica</title>
    <!-- Web fonts load where supported (Apple Mail, iOS); elsewhere the Helvetica/Arial fallbacks apply. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;1,600&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin:0;padding:0;background-color:#071a33;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#071a33" style="background-color:#071a33;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" bgcolor="#0b2545" style="width:100%;max-width:560px;background-color:#0b2545;border-radius:16px;">
            <tr>
              <td style="padding:40px 32px 8px 32px;font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:600;font-style:italic;letter-spacing:-0.02em;color:#ffffff;">
                Guadagnare non basta<span style="color:#6fa3ff;font-style:normal;">+</span>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 0 32px;font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:34px;line-height:1.15;font-weight:600;letter-spacing:-0.02em;color:#ffffff;">
                La tua <span style="font-style:italic;color:#6fa3ff;">mappa</span> finanziaria
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 0 32px;font-family:'Lato','Helvetica Neue',Arial,sans-serif;font-size:17px;line-height:1.6;color:#dce6f5;">
                Ecco il tuo codice di verifica. Scrivilo nella pagina da cui hai iniziato.
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 0 32px;">
                <!-- Plain text, no link or image: Gmail offers "Copy code"; user-select:all makes one tap select the whole code where supported. -->
                <div style="display:inline-block;padding:16px 24px;background-color:#071a33;border-radius:12px;font-family:'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:36px;line-height:1.2;font-weight:700;letter-spacing:0.3em;color:#ffffff;-webkit-user-select:all;user-select:all;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 0 32px;font-family:'Lato','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.6;color:#dce6f5;">
                Il codice scade tra 10 minuti. Se ne richiedi uno nuovo, vale solo l’ultimo.
              </td>
            </tr>
            <tr>
              <td style="padding:32px 32px 40px 32px;font-family:'Lato','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.6;color:#a7bbd6;">
                Se non hai richiesto tu questo messaggio, puoi ignorarlo.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
